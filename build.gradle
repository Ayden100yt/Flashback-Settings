plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def mc = project.property("mc").toString()
def mcKey = "mc_" + mc.replace(".", "_")
def mcProp = { String name ->
    def value = project.findProperty("${mcKey}.${name}")
    if (value == null) {
        throw new GradleException("Unsupported Minecraft version '${mc}': ${mcKey}.${name} is missing in gradle.properties")
    }
    return value.toString()
}

version = "${project.mod_version}+${mc}"
base {
    archivesName = "flashback-settings"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "flashback-settings" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${mcProp("fabric_api_version")}"

    compileOnly "maven.modrinth:flashback:${mcProp("flashback_version")}"
    localRuntime "maven.modrinth:flashback:${mcProp("flashback_version")}"
}

processResources {
    def expandProps = [
        "version"      : project.version,
        "minecraft"    : mc,
        "flashback_min": mcProp("flashback_min")
    ]
    inputs.properties expandProps

    filesMatching("fabric.mod.json") {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}